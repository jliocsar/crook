name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME tags $GITHUB_SHA, which is not on main. Tag a commit that main has merged."
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun packages/release/src/main.ts check-version --tag "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run fmt:check

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: bun install --frozen-lockfile
      - run: bun run release:build
      - name: Run the linux-x64 artifacts
        run: sh packages/release/smoke.sh dist linux-x64 "${GITHUB_REF_NAME#v}" 8473
      - name: Checksum the artifacts
        working-directory: dist
        run: |
          cp ../packages/release/install.sh install.sh
          sha256sum crook-* install.sh > SHA256SUMS
      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Check the signature the way install.sh does
        working-directory: dist
        run: >-
          cosign verify-blob
          --bundle SHA256SUMS.sigstore.json
          --certificate-identity "https://github.com/jliocsar/crook/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          SHA256SUMS
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "crook $GITHUB_REF_NAME"
          --notes "Install with: sh install.sh --version ${GITHUB_REF_NAME#v} [agent] [hub]"
          crook-* install.sh SHA256SUMS SHA256SUMS.sigstore.json
